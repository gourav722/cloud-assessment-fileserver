name: CI-CD Pipeline

on:
  push:
    branches:
      - main

env:
  # GHCR image path — automatically uses your GitHub username, always lowercase
  IMAGE: ghcr.io/${{ github.repository_owner }}/fileserver

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    # Needed to push to GHCR and write package metadata
    permissions:
      contents: read
      packages: write

    steps:
      # ----------------------------------------------------------------
      # 1. Checkout
      # ----------------------------------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 2. Go — build AND test
      #    (your original only had go build — go test proves correctness)
      # ----------------------------------------------------------------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Go Build
        run: |
          cd app
          go build .

      - name: Go Test
        run: |
          cd app
          go test ./... -v

      # ----------------------------------------------------------------
      # 3. Helm lint — base values + both env overrides
      # ----------------------------------------------------------------
      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Helm Lint (base)
        run: helm lint helm/fileserver

      - name: Helm Lint (dev values)
        run: helm lint helm/fileserver -f helm/fileserver/values-dev.yaml

      - name: Helm Lint (prod values)
        run: helm lint helm/fileserver -f helm/fileserver/values-prod.yaml

      # ----------------------------------------------------------------
      # 4. Terraform — kind root (fmt + validate only, no plan)
      #    terraform plan needs a live cluster + kubeconfig, so it runs
      #    later after kind is up. fmt and validate are enough here.
      # ----------------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init (kind)
        run: |
          cd terraform
          terraform init -backend=false

      - name: Terraform Format Check (kind)
        run: |
          cd terraform
          terraform fmt -check -recursive

      - name: Terraform Validate (kind)
        run: |
          cd terraform
          terraform validate

      # ----------------------------------------------------------------
      # 5. Terraform — Azure stub (validate only, no credentials needed)
      #    This proves the module abstraction is syntactically correct
      #    without requiring an Azure subscription.
      # ----------------------------------------------------------------
      - name: Terraform Init (azure stub)
        run: |
          cd terraform/azure
          terraform init -backend=false

      - name: Terraform Format Check (azure stub)
        run: |
          cd terraform/azure
          terraform fmt -check -recursive

      - name: Terraform Validate (azure stub)
        run: |
          cd terraform/azure
          terraform validate

      # ----------------------------------------------------------------
      # 6. Build Docker image
      #    Tagged with commit SHA — immutable and traceable
      # ----------------------------------------------------------------
      - name: Build Docker Image
        run: |
          docker build -t fileserver:${{ github.sha }} ./app
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} ./app

      # ----------------------------------------------------------------
      # 7. Push to GHCR (GitHub Container Registry)
      #    Free, no external registry needed, token is automatic.
      #    Image will be visible at: ghcr.io/<your-username>/fileserver
      # ----------------------------------------------------------------
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          echo "Image pushed: ${{ env.IMAGE }}:${{ github.sha }}"

      # ----------------------------------------------------------------
      # 8. Spin up kind cluster
      # ----------------------------------------------------------------
      - name: Create kind Cluster
        uses: helm/kind-action@v1

      # ----------------------------------------------------------------
      # 9. Load the locally-built image into kind
      #    kind cannot pull from GHCR without imagePullSecrets,
      #    so we load the local Docker image directly — faster too.
      # ----------------------------------------------------------------
      - name: Load Docker Image into kind
        run: |
          kind load docker-image fileserver:${{ github.sha }} --name chart-testing

      # ----------------------------------------------------------------
      # 10. Create PVC before Helm deploy
      #     The chart expects an existing PVC (existingPvc value).
      #     kind uses the standard StorageClass with a local provisioner.
      # ----------------------------------------------------------------
      - name: Create PVC
        run: |
          kubectl apply -f - <<EOF
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: fileserver-pvc
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 1Gi
          EOF

      # ----------------------------------------------------------------
      # 11. Deploy via Helm
      # ----------------------------------------------------------------
      - name: Deploy Application via Helm
        run: |
          helm upgrade --install fileserver ./helm/fileserver \
            --set image.repository=fileserver \
            --set image.tag=${{ github.sha }} \
            --set image.pullPolicy=Never \
            --set existingPvc=fileserver-pvc \
            --wait \
            --timeout 90s

      # ----------------------------------------------------------------
      # 12. Verify Kubernetes resources
      # ----------------------------------------------------------------
      - name: Verify Kubernetes Resources
        run: |
          kubectl get pods
          kubectl get pvc
          kubectl get svc

      # ----------------------------------------------------------------
      # 13. End-to-end HTTP test — the real proof it works
      #     Tests both the happy path (file exists) and the 404 path.
      # ----------------------------------------------------------------
      - name: End-to-End HTTP Test
        run: |
          # Port-forward in background (service port 8081 → local 8080)
          kubectl port-forward svc/fileserver 8080:8081 &
          PF_PID=$!

          # Wait for port-forward to be ready
          sleep 5

          echo "--- Test 1: File read (expect 200 + file contents) ---"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/test.txt)
          echo "HTTP status: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "FAIL: expected 200, got $RESPONSE"
            kill $PF_PID
            exit 1
          fi

          BODY=$(curl -s http://localhost:8080/test.txt)
          echo "Response body: $BODY"
          echo "PASS: file read returned 200"

          echo ""
          echo "--- Test 2: Missing file (expect 404 + JSON error body) ---"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/missing-file.txt)
          echo "HTTP status: $RESPONSE"
          if [ "$RESPONSE" != "404" ]; then
            echo "FAIL: expected 404, got $RESPONSE"
            kill $PF_PID
            exit 1
          fi

          BODY=$(curl -s http://localhost:8080/missing-file.txt)
          echo "Response body: $BODY"
          if echo "$BODY" | grep -q "file not found"; then
            echo "PASS: 404 returned correct JSON error body"
          else
            echo "FAIL: 404 body missing 'file not found'"
            kill $PF_PID
            exit 1
          fi

          echo ""
          echo "All tests passed"
          kill $PF_PID
